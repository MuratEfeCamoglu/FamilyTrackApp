name: familytrackapp
description: "Aile Takip Uygulaması — Sevdiklerinizle geçirdiğiniz önemli anları kayıt altına alın."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # iOS stil ikonları
  cupertino_icons: ^1.0.8

  # State Management — CLAUDE.md: Cubit (flutter_bloc) zorunlu
  flutter_bloc: ^8.1.5

  # Dependency Injection — CLAUDE.md: get_it + injectable
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Firebase — CLAUDE.md: Firestore + Auth + Storage
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # Fonksiyonel Programlama — CLAUDE.md: Either pattern (dartz)
  dartz: ^0.10.1

  # UI — CLAUDE.md: google_fonts (Nunito + DM Sans), cached images
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Fotoğraf seçme ve sıkıştırma — CLAUDE.md: max 5MB kontrolü
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0

  # Utility
  intl: ^0.20.2          # Tarih formatlama
  equatable: ^2.0.5      # Value equality (state sınıfları için)
  uuid: ^4.4.0            # Benzersiz ID üretimi
  go_router: ^17.2.3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Kod üretimi — injectable için zorunlu
  injectable_generator: ^2.4.2
  build_runner: ^2.4.9

  # Linting
  flutter_lints: ^4.0.0

  # Uygulama simgesi üretimi (Android adaptive + iOS) — `dart run flutter_launcher_icons`
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Ön plan görseli güvenli alana göre zaten boyutlandırıldı; ek boşluk eklenmez
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
